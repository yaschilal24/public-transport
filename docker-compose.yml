version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: transitconnect-db
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit_dev_password
      POSTGRES_DB: transitconnect
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: